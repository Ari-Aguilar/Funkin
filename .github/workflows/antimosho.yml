name: Build FNF Linux
on:
  workflow_dispatch:
    inputs:
      save-artifact:
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvlc-dev libvlccore-dev \
            libx11-dev libxext-dev libxi-dev \
            libxrandr-dev libxcursor-dev \
            libgl1-mesa-dev libopenal-dev \
            libdbus-1-dev libwayland-dev \
            gcc g++ make cmake neko

      - name: Install hmm and haxe dependencies
        run: |
          haxelib --global git haxelib https://github.com/FunkinCrew/haxelib.git
          haxelib --global git hmm https://github.com/FunkinCrew/hmm.git
          haxelib --global run hmm setup
          haxelib --global run hmm install -q

      - name: Compile hxcpp tools
        run: |
          pushd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml
          popd

      - name: Build lime ndll directly
        run: |
          LIME_PATH=$(haxelib path lime | grep "^/" | head -1)
          echo "Lime path: $LIME_PATH"
          cd "$LIME_PATH"

          cd project
          haxelib run hxcpp Build.xml -Dlinux -DHXCPP_M64
          cd ..

          echo "NDLLs encontrados:"
          find . -name "*.ndll" 2>/dev/null

      - name: Copiar ndll a la ruta correcta
        run: |
          LIME_PATH=$(haxelib path lime | grep "^/" | head -1)
          mkdir -p "$LIME_PATH/ndll/Linux64"

          NDLL=$(find "$LIME_PATH" -name "lime.ndll" | head -1)
          if [ -n "$NDLL" ]; then
            cp "$NDLL" "$LIME_PATH/ndll/Linux64/lime.ndll"
            echo "ndll copiado desde: $NDLL"
          else
            echo "ERROR: lime.ndll no encontrado"
            exit 1
          fi

      - name: Setup lime
        run: haxelib --always run lime setup

      - name: Build game
        run: haxelib run lime build linux -v -release

      - name: Upload artifact
        if: ${{ inputs.save-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Linux
          path: export/release/linux/bin/
          retention-days: 7
